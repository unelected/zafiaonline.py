[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "zafiaonline"
version = "3.0.11"
description = "A Python API library for interacting with Mafia Online game."
requires-python = ">=3.9"
license = { text = "LGPL-2.1" }
authors = [
    { name = "unelected" }
]
dependencies = [
    "websockets",
    "msgspec",
    "sphinx"
]
